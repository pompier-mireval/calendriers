<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tournée des calendriers</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f4f2;--panel:#fff;--fg:#1f1b1a;--muted:#6b625f;--line:#e2dcd8;--accent:#c8231b;--ok:#2e7d32;
--t1:#ff4136;--t2:#3d8bff;--t3:#2ecc40;--t4:#ffb000;--display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#171413;--panel:#211d1c;--fg:#f1ece9;--muted:#a59b97;--line:#38312f;--accent:#ff5a4e;--ok:#66bb6a;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
.gut{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.top{position:sticky;top:0;z-index:1000;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{max-width:1000px;margin:0 auto;padding-block:10px;display:grid;gap:8px}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:24px;line-height:1;margin:0}h1 span{color:var(--accent)}
.chips{display:flex;gap:6px;margin-left:auto}
.chip{font:600 15px var(--body);color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:var(--panel)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;width:0;background:var(--c);transition:width .3s}
small.p{color:var(--muted)}
main{max-width:1000px;margin:0 auto;padding-block:12px 40px;display:grid;gap:12px}
.status{font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--t4);background:var(--panel)}
.mapbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.mapbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.btn{font:600 14px var(--body);color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.loc{background:#1a73e8;color:#fff;border-color:#1a73e8}
#map{height:min(68vh,620px);background:#222}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.here{border-color:#1a73e8}
.card h2{font-family:var(--display);font-size:26px;line-height:1.05;margin:0}
.meta{color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:700}.tag i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.big{font:700 16px var(--body);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--ok);color:#fff}
.big.undo{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.ok{color:var(--ok);font-weight:600}.part{color:#d97706;font-weight:700}
.partbox{display:grid;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.partbox .r{display:flex;gap:8px;flex-wrap:wrap}.partbox input{flex:1;min-width:120px}
.big.mid{background:#d97706}
li .pt{color:#d97706;font-weight:600}
.lh{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.lh h2{margin-right:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:600 14px var(--body);color:inherit;background:var(--panel);border:0;padding:6px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--fg);color:var(--bg)}
input[type=search],input[type=text]{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}li:first-child{border-top:0}
li input{width:22px;height:22px;accent-color:var(--ok);flex:none}
li .nm{flex:1;min-width:0;cursor:pointer}li .nm small{display:block;color:var(--muted);font-size:13px}
li.isdone .nm span{text-decoration:line-through;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:0}
.me-dot{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.4)}
.leaflet-tooltip{font:600 13px var(--body)}
</style>
</head>
<body>
<div class="top gut"><div class="in">
  <div class="row1"><h1>Calendriers <span>2027</span></h1><div class="chips" id="chips"></div></div>
  <div id="prog"><div class="bar"><b id="barf"></b></div><small class="p" id="progt"></small></div>
</div></div>
<main class="gut">
  <div class="status" id="status" hidden></div>
  <div class="mapbox">
    <div class="mapbar">
      <button class="btn loc" id="bLoc">📍 Me localiser</button>
      <button class="btn" id="bSat">Plan</button>
      <button class="btn" id="vMir">Ma zone Mireval</button>
      <button class="btn" id="vVil">Ma zone Villeneuve</button>
    </div>
    <div id="map"></div>
  </div>
  <div class="card here" id="here" hidden></div>
  <div class="card" id="det"><p class="note">Touche une rue sur la carte ou dans la liste.</p></div>
  <div class="card">
    <div class="lh"><h2 style="font-family:var(--display);font-size:24px;margin:0 auto 0 0">Mes rues</h2>
      <div class="seg" id="segC"><button data-c="1" class="on">Mireval</button><button data-c="2">Villeneuve</button></div>
      <div class="seg" id="segF"><button data-f="todo" class="on">À faire</button><button data-f="done">Faites</button><button data-f="all">Toutes</button></div>
    </div>
    <input id="q" type="search" placeholder="Chercher une rue…">
    <ul id="list"></ul>
  </div>
  <div class="card"><label for="who" class="note">Ton prénom (pour savoir qui a coché)</label><input id="who" type="text" placeholder="Prénom"></div>
  <p class="note">Chaque rue est faite entièrement (des deux côtés) par une seule équipe. En gris : morceaux de rue sans maison. Rues : © OpenStreetMap. Images satellite : Esri, Maxar, Earthstar Geographics.</p>
</main>

e-neuve","n":"Rue Neuve","c":2,"t":4,"b":28,"d":null,"l":[[[3.861433,43.532134],[3.860917,43.532973]],[[3.861629,43.531804],[3.861482,43.532063]],[[3.861914,43.531335],[3.861649,43.531768]]]},{"id":"c2-rue-paul-eluard","n":"Rue Paul Éluard","c":2,"t":3,"b":28,"d":null,"l":[[[3.863826,43.5359],[3.863758,43.535811],[3.863627,43.53581],[3.863242,43.535973],[3.863225,43.536022],[3.863595,43.536419],[3.864452,43.536056]]]},{"id":"c2-rue-porte-saint-laurent","n":"Rue Porte Saint-Laurent","c":2,"t":3,"b":15,"d":null,"l":[[[3.861497,43.532711],[3.861727,43.532781],[3.862034,43.532948]]]},{"id":"c2-rue-rene-bert","n":"Rue René Bert","c":2,"t":3,"b":2,"d":null,"l":[[[3.866048,43.528336],[3.866846,43.528852],[3.866933,43.528885],[3.867101,43.528893],[3.867592,43.528792],[3.867686,43.52881],[3.867735,43.528857],[3.867783,43.529091],[3.867791,43.529305],[3.867823,43.529363],[3.868109,43.529534],[3.867133,43.529845],[3.865966,43.530023]]]},{"id":"c2-rue-sidonie-colette","n":"Rue Sidonie Colette","c":2,"t":3,"b":31,"d":null,"l":[[[3.867898,43.537688],[3.867806,43.537762],[3.8678,43.537801],[3.867867,43.537851],[3.868627,43.537946],[3.86868,43.537943],[3.868742,43.5379],[3.86874,43.537861],[3.868671,43.537789],[3.868287,43.537559],[3.868124,43.537564],[3.867898,43.537688]]]},{"id":"c2-rue-emile-zola","n":"Rue Émile Zola","c":2,"t":3,"b":25,"d":null,"l":[[[3.866394,43.536985],[3.865943,43.536591]],[[3.865943,43.536591],[3.865493,43.536208],[3.865447,43.536204],[3.865223,43.536305],[3.865222,43.536362],[3.865268,43.536403],[3.865943,43.536591]]]},{"id":"c2-zae-du-larzat","n":"ZAE du Larzat","c":2,"t":4,"b":26,"d":null,"l":[[[3.828859,43.547911],[3.828831,43.548077],[3.828846,43.548154],[3.82889,43.548234],[3.829022,43.548345],[3.830496,43.548818],[3.830683,43.548835],[3.830866,43.548782],[3.830982,43.548667],[3.831385,43.547614],[3.831401,43.547463]]]}],"outline":[[43.502114,3.785151],[43.49937,3.787995],[43.495697,3.793585],[43.510922,3.865264],[43.53912,3.880901],[43.554196,3.846597],[43.554393,3.844582],[43.548765,3.82738],[43.545055,3.823242],[43.539766,3.82297],[43.528717,3.822319],[43.519675,3.809088],[43.502114,3.785151]]};
const COL={1:'#ff4136',2:'#3d8bff',3:'#2ecc40',4:'#ffb000'};
const COM={1:'Mireval',2:'Villeneuve-lès-Maguelone'};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let team=+LS.get('equipe')||1,com=1,filt='todo',sel=null,done={},fb=null;
const byId={};D.items.forEach(i=>byId[i.id]=i);
const who=document.getElementById('who');who.value=LS.get('prenom')||'';who.oninput=()=>LS.set('prenom',who.value.trim());
// carte
const map=L.map('map',{zoomControl:true}).setView([43.52,3.83],14);
const sat=L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri, Maxar'}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.6}),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})
]);
const plan=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
let isSat=LS.get('fond')!=='plan';(isSat?sat:plan).addTo(map);
const bSat=document.getElementById('bSat');bSat.textContent=isSat?'Vue plan':'Vue satellite';
bSat.onclick=()=>{map.removeLayer(isSat?sat:plan);isSat=!isSat;(isSat?sat:plan).addTo(map);bSat.textContent=isSat?'Vue plan':'Vue satellite';LS.set('fond',isSat?'sat':'plan')};
L.polygon(D.outline,{color:'#fff',weight:2,dashArray:'6 6',fill:false,interactive:false}).addTo(map);
(D.empty||[]).forEach(l=>L.polyline(l.map(p=>[p[1],p[0]]),{color:'#bdbdbd',weight:2,opacity:.8,interactive:false}).addTo(map));
const lay={};
D.items.forEach(i=>{const pl=L.polyline(i.l.map(s=>s.map(p=>[p[1],p[0]])),{weight:4,color:COL[i.t]}).addTo(map);
  pl.bindTooltip(i.n,{sticky:true});pl.on('click',()=>pick(i.id,false));lay[i.id]=pl});
const isDone=id=>!!done[id]&&done[id].s!=='part';const isPart=id=>!!done[id]&&done[id].s==='part';
function partTxt(d){return 'En cours'+(d.n?' · arrêté au n°'+esc(d.n):'')+(d.note?' · '+esc(d.note):'')}
function style(){D.items.forEach(i=>{const d=isDone(i.id),p=isPart(i.id),m=i.t===team,s=i.id===sel;
  lay[i.id].setStyle({color:d?'#9e9e9e':COL[i.t],weight:s?9:(m?6:3),opacity:m||s?1:.55,dashArray:d?'4 8':(p?'14 8':null)});if(s)lay[i.id].bringToFront()})}
function zoneBounds(c){const b=L.latLngBounds([]);D.items.filter(i=>i.t===team&&i.c===c).forEach(i=>b.extend(lay[i.id].getBounds()));return b}
document.getElementById('vMir').onclick=()=>map.fitBounds(zoneBounds(1));
document.getElementById('vVil').onclick=()=>map.fitBounds(zoneBounds(2));
// localisation
let meMk=null,meCirc=null,locOn=false,first=true;
document.getElementById('bLoc').onclick=()=>{if(!locOn){locOn=true;first=true;map.locate({watch:true,enableHighAccuracy:true});document.getElementById('bLoc').textContent='📍 Localisation active'}else if(meMk){map.setView(meMk.getLatLng(),18)}};
map.on('locationfound',e=>{if(!meMk){meMk=L.marker(e.latlng,{icon:L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[18,18]}),zIndexOffset:1000}).addTo(map);meCirc=L.circle(e.latlng,{radius:e.accuracy,color:'#1a73e8',weight:1,fillOpacity:.1}).addTo(map)}
  else{meMk.setLatLng(e.latlng);meCirc.setLatLng(e.latlng).setRadius(e.accuracy)}
  if(first){map.setView(e.latlng,18);first=false}nearest(e.latlng)});
map.on('locationerror',e=>{locOn=false;document.getElementById('bLoc').textContent='📍 Me localiser';status('Localisation refusée ou indisponible. Autorise la position pour ce site dans les réglages du navigateur.')});
function nearest(ll){const k=Math.cos(ll.lat*Math.PI/180)*111320,ky=110570;let best=null;
  for(const i of D.items)for(const s of i.l)for(let j=0;j<s.length-1;j++){
    const ax=(s[j][0]-ll.lng)*k,ay=(s[j][1]-ll.lat)*ky,bx=(s[j+1][0]-ll.lng)*k,by=(s[j+1][1]-ll.lat)*ky;
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;let t=L2?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));const d=Math.hypot(ax+t*dx,ay+t*dy);
    if(!best||d<best.d)best={d,i}}
  const h=document.getElementById('here');if(!best||best.d>150){h.hidden=true;return}
  const i=best.i,d=done[i.id];h.hidden=false;const stt=isDone(i.id)?'<span class="ok">Déjà faite</span>':(isPart(i.id)?`<span class="part">${partTxt(d)}</span>`:'<span>À faire</span>');
  h.innerHTML=`<div class="meta">Tu es dans</div><h2>${esc(i.n)}</h2><div class="meta"><span class="tag" style="--c:${COL[i.t]}"><i></i>Équipe ${i.t}</span>${stt}${i.t!==team?`<span>(pas ton équipe)</span>`:''}</div><div class="acts"><button class="btn" id="hereSel">Ouvrir la fiche</button></div>`;
  document.getElementById('hereSel').onclick=()=>pick(i.id,false)}
// équipes, listes
const chips=document.getElementById('chips');
for(const t of [1,2,3,4]){const b=document.createElement('button');b.className='chip';b.id='eq'+t;b.style.setProperty('--c',COL[t]);b.innerHTML=`<i></i>Éq. ${t}`;b.onclick=()=>setTeam(t,true);chips.appendChild(b)}
function setTeam(t,fit){team=t;LS.set('equipe',t);document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.id==='eq'+t));document.getElementById('prog').style.setProperty('--c',COL[t]);render();if(fit)map.fitBounds(zoneBounds(com))}
document.querySelectorAll('#segC button').forEach(b=>b.onclick=()=>{com=+b.dataset.c;document.querySelectorAll('#segC button').forEach(x=>x.classList.toggle('on',x===b));renderList();map.fitBounds(zoneBounds(com))});
document.querySelectorAll('#segF button').forEach(b=>b.onclick=()=>{filt=b.dataset.f;document.querySelectorAll('#segF button').forEach(x=>x.classList.toggle('on',x===b));renderList()});
document.getElementById('q').oninput=renderList;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){style();const mine=D.items.filter(i=>i.t===team),nd=mine.filter(i=>isDone(i.id)),np=mine.filter(i=>isPart(i.id));
  const bt=mine.reduce((a,i)=>a+i.b,0),bd=nd.reduce((a,i)=>a+i.b,0),pc=Math.round(bt?100*bd/bt:0);
  document.getElementById('barf').style.width=pc+'%';
  document.getElementById('progt').textContent=`Équipe ${team} : ${nd.length} rue${nd.length>1?'s':''} faite${nd.length>1?'s':''} sur ${mine.length}${np.length?` · ${np.length} en cours`:''} · ${pc} % des bâtiments`;
  renderList();renderDet();if(meMk)nearest(meMk.getLatLng())}
function renderList(){const q=document.getElementById('q').value.trim().toLowerCase();
  const rows=D.items.filter(i=>i.t===team&&i.c===com&&(filt==='all'||(filt==='done')===isDone(i.id))&&(!q||i.n.toLowerCase().includes(q)));
  const ul=document.getElementById('list');
  if(!rows.length){ul.innerHTML=`<li class="note">${filt==='todo'?'Tout est fait ici. Bravo !':'Aucune rue.'}</li>`;return}
  rows.sort((a,b)=>isPart(b.id)-isPart(a.id));
  ul.innerHTML=rows.map(i=>`<li class="${isDone(i.id)?'isdone':''}"><input type="checkbox" data-id="${i.id}" ${isDone(i.id)?'checked':''} aria-label="${esc(i.n)}"><div class="nm" data-id="${i.id}"><span>${esc(i.n)}</span><small>${isPart(i.id)?`<span class="pt">${partTxt(done[i.id])}</span>`:`${i.d?esc(i.d)+' · ':''}${i.b} bâtiment${i.b>1?'s':''}`}</small></div><button class="btn" data-id="${i.id}">Voir</button></li>`).join('');
  ul.querySelectorAll('input').forEach(c=>c.onchange=()=>toggle(c.dataset.id,c.checked));
  ul.querySelectorAll('.nm,button').forEach(n=>n.onclick=()=>pick(n.dataset.id,true))}
function gmaps(i){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(i.n+', '+(i.c===1?'34110 Mireval':'34750 Villeneuve-lès-Maguelone'))}
function renderDet(){if(!sel)return;const i=byId[sel],d=done[sel],box=document.getElementById('det');
  const when=d&&d.at?' · '+new Date(d.at).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}):'';
  const w=isDone(sel)?`<span class="ok">Faite${d.by?' par '+esc(d.by):''}${when}</span>`:(isPart(sel)?`<span class="part">${partTxt(d)}${d.by?' ('+esc(d.by)+')':''}${when}</span>`:'');
  box.innerHTML=`<h2>${esc(i.n)}</h2><div class="meta"><span class="tag" style="--c:${COL[i.t]}"><i></i>Équipe ${i.t}</span><span>${COM[i.c]}</span><span>${i.b} bâtiment${i.b>1?'s':''}</span>${w}</div>${i.d?`<p class="part" style="margin:0">Rue partagée : ton équipe fait seulement la partie ${esc(i.d)}.</p>`:''}
  <div class="acts">${isDone(sel)?'':'<button class="big" id="tgF">Faite entièrement</button>'}<button class="big mid" id="tgP">${isPart(sel)?'Modifier où on s\'est arrêté':'Faite en partie'}</button>${d?'<button class="big undo" id="tgU">Remettre à faire</button>':''}<a class="btn" href="${gmaps(i)}" target="_blank" rel="noopener">Itinéraire</a></div>
  <div class="partbox" id="pbox" hidden><label class="note" for="pn">Arrêtés au numéro</label><div class="r"><input id="pn" type="text" inputmode="numeric" placeholder="ex : 24" value="${isPart(sel)&&d.n?esc(d.n):''}"></div>
  <label class="note" for="pnote">Remarque (facultatif)</label><input id="pnote" type="text" placeholder="ex : côté pair fait, reste l'impasse" value="${isPart(sel)&&d.note?esc(d.note):''}">
  <div class="r"><button class="big mid" id="psave">Enregistrer</button><button class="btn" id="pcancel">Annuler</button></div></div>`;
  const f=document.getElementById('tgF');if(f)f.onclick=()=>save(sel,'fait');
  const u=document.getElementById('tgU');if(u)u.onclick=()=>save(sel,null);
  document.getElementById('tgP').onclick=()=>{const b=document.getElementById('pbox');b.hidden=false;document.getElementById('pn').focus()};
  document.getElementById('pcancel').onclick=()=>{document.getElementById('pbox').hidden=true};
  document.getElementById('psave').onclick=()=>save(sel,'part',document.getElementById('pn').value.trim().slice(0,20),document.getElementById('pnote').value.trim().slice(0,120))}
function pick(id,zoom){sel=id;if(zoom){map.fitBounds(lay[id].getBounds(),{maxZoom:18,padding:[40,40]});document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'})}render();document.getElementById('det').scrollIntoView({behavior:'smooth',block:'nearest'})}
function toggle(id,val){save(id,val?'fait':null)}
function save(id,st,n,note){const v=st?{t:byId[id].t,at:Date.now(),by:who.value.trim(),s:st}:null;if(v&&st==='part'){v.n=n||'';v.note=note||''}
  if(fb){(v?fb.child(id).set(v):fb.child(id).remove()).catch(()=>status('Pas enregistré. Vérifie ta connexion.'))}
  else{if(v)done[id]=v;else delete done[id];LS.set('fait',JSON.stringify(done));render()}}
function status(t){const s=document.getElementById('status');s.textContent=t;s.hidden=!t}
// données partagées
if(FIREBASE_CONFIG.databaseURL&&window.firebase){firebase.initializeApp(FIREBASE_CONFIG);fb=firebase.database().ref('fait');
  fb.on('value',s=>{done=s.val()||{};render()},()=>status('Impossible de lire la liste partagée. Vérifie la configuration Firebase.'))}
else{try{done=JSON.parse(LS.get('fait')||'{}')}catch(e){done={}}status('Mode test : les coches restent sur ce téléphone (Firebase pas encore configuré).')}
setTeam(team,false);map.fitBounds(zoneBounds(com));
</script>
